<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>course-bot 控制台</title>
<style>
  :root{
    --bg:#0d1017; --panel:#151a23; --panel2:#1b222e; --line:#242c3a;
    --txt:#e6ebf2; --dim:#8b97a8; --accent:#4c8dff; --ok:#3ddc97;
    --warn:#ffb454; --err:#ff6b6b; --purple:#a78bfa;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:14px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:14px 20px;
    border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:9}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.3px}
  .badge{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--panel2);
    border:1px solid var(--line);color:var(--dim)}
  .badge.on{color:var(--ok);border-color:#1f4d3a;background:#10231b}
  .badge.off{color:var(--err);border-color:#4d1f1f;background:#231010}
  .spacer{flex:1}
  main{display:grid;grid-template-columns:300px 1fr 420px;gap:14px;padding:14px;align-items:start}
  @media (max-width:1250px){main{grid-template-columns:1fr;}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--dim);font-weight:600;
    text-transform:uppercase;letter-spacing:.8px}
  .row{display:flex;gap:8px;align-items:center}
  button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
    border-radius:9px;padding:9px 14px;font-size:13.5px;cursor:pointer;transition:.15s}
  button:hover:not(:disabled){border-color:#3a465c;background:#222b3a}
  button:disabled{opacity:.38;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:hover:not(:disabled){background:#5f9aff}
  button.danger{border-color:#5a2626;color:#ff9b9b}
  button.ghost{background:transparent}
  input[type=text],input[type=number],input[type=password],select{background:#0b0f16;
    border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;
    font-size:13px;width:100%}
  input[type=password]{font-family:ui-monospace,monospace}
  label.opt{display:flex;justify-content:space-between;align-items:center;
    gap:10px;margin:9px 0;font-size:13px;color:var(--dim)}
  label.opt > span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  label.opt input[type=number],label.opt select,label.opt input[type=text],
  label.opt input[type=password]{width:160px;flex:0 0 auto}
  .switch{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:13px;cursor:pointer}
  #courseList{max-height:340px;overflow:auto;margin-top:8px}
  .course{display:flex;gap:9px;align-items:flex-start;padding:8px 9px;border-radius:8px;
    cursor:pointer;border:1px solid transparent}
  .course:hover{background:var(--panel2)}
  .course.sel{background:#16233a;border-color:#26456f}
  .course input{margin-top:3px;accent-color:var(--accent)}
  .course .nm{font-size:13px;line-height:1.35}
  .course .id{font-size:11px;color:var(--dim)}
  .status-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .stat{background:var(--panel2);border-radius:9px;padding:10px 12px}
  .stat .k{font-size:11px;color:var(--dim);letter-spacing:.5px}
  .stat .v{font-size:19px;font-weight:600;margin-top:2px}
  .bar{height:7px;background:#0b0f16;border-radius:5px;overflow:hidden;margin:10px 0 4px}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4c8dff,#a78bfa);
    transition:width .35s}
  .now{font-size:13px;color:var(--dim);min-height:38px}
  .now b{color:var(--txt);font-weight:600}
  #log{height:640px;overflow:auto;font:12.5px/1.6 ui-monospace,Consolas,"Courier New",monospace;
    background:#0a0d13;border-radius:9px;padding:10px;border:1px solid var(--line)}
  .ln{white-space:pre-wrap;word-break:break-word}
  .ln .t{color:#4b5666;margin-right:7px}
  .ln.WARNING{color:var(--warn)}
  .ln.ERROR,.ln.CRITICAL{color:var(--err)}
  .ln.SUCCESS{color:var(--ok)}
  .ln.DEBUG{color:#6b7688}
  .phase{font-size:12px;padding:3px 10px;border-radius:20px;background:#1b2436;
    color:var(--accent);border:1px solid #24406b}
  .muted{color:var(--dim);font-size:12px}
  hr{border:0;border-top:1px solid var(--line);margin:13px 0}
  details.llm{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-top:4px}
  details.llm summary{cursor:pointer;font-size:13px;color:var(--dim);list-style:none}
  details.llm summary::-webkit-details-marker{display:none}
  details.llm summary::before{content:"▸ ";color:var(--accent)}
  details.llm[open] summary::before{content:"▾ "}
  details.llm .body{padding-top:8px}
  .tag{font-size:11px;padding:1px 7px;border-radius:10px;margin-left:6px}
  .tag.on{background:#10231b;color:var(--ok)}
  .tag.off{background:#231010;color:var(--err)}
</style>
</head>
<body>
<header>
  <h1>course-bot</h1>
  <span id="loginBadge" class="badge off">未登录</span>
  <span id="runBadge" class="badge">空闲</span>
  <span id="phaseBadge" class="phase" style="display:none">idle</span>
  <div class="spacer"></div>
  <span class="badge">题库 <b id="bankTotal">0</b> 题</span>
  <span class="badge" id="pendingBadge" title="没把握、需要你补题库的题目数">待核对 <b id="pendingCount">0</b></span>
  <button class="ghost" onclick="doLogin()">登录 / 重新登录</button>
</header>

<main>
  <!-- 左：课程 -->
  <section class="card">
    <h2>课程</h2>
    <input type="text" id="search" placeholder="搜索课程…" oninput="renderCourses()">
    <div class="row" style="margin-top:8px">
      <button class="ghost" style="flex:1" onclick="toggleAll()">全选 / 反选</button>
      <button class="ghost" style="flex:1" onclick="refreshCourses()">刷新</button>
    </div>
    <div id="courseList"><div class="muted" style="padding:10px">点「刷新」拉取课程</div></div>
    <hr>
    <div class="muted">已选 <b id="selCount">0</b> 门</div>
  </section>

  <!-- 中：控制 -->
  <section class="card">
    <h2>控制</h2>
    <div class="row" style="gap:10px;flex-wrap:wrap">
      <button id="btnStart" class="primary" onclick="startRun()">开始刷课</button>
      <button id="btnPause" onclick="pauseRun()" disabled>暂停</button>
      <button id="btnResume" onclick="resumeRun()" disabled>继续</button>
      <button id="btnStop" class="danger" onclick="stopRun()" disabled>停止</button>
    </div>

    <hr>
    <label class="opt"><span>模式</span>
      <select id="mode">
        <option value="all">视频 + 测验</option>
        <option value="video">只刷视频</option>
        <option value="quiz">只做测验</option>
      </select>
    </label>
    <label class="opt"><span>倍速</span>
      <input type="number" id="rate" value="1.5" step="0.1" min="1" max="3">
    </label>
    <label class="opt"><span>每门课最多几个小节（0 = 全部）</span>
      <input type="number" id="maxTasks" value="0" min="0">
    </label>
    <label class="opt"><span>提交测验答案</span>
      <input type="checkbox" id="submit" checked style="width:auto">
    </label>
    <label class="opt"><span>无窗口运行<em style="color:var(--warn);font-style:normal;font-size:11px"> （平台不记账，别开）</em></span>
      <input type="checkbox" id="headless" style="width:auto">
    </label>

    <details class="llm" id="llmBox">
      <summary>模型答题设置<span id="llmTag" class="tag off">未启用</span></summary>
      <div class="body">
        <label class="opt"><span>启用模型答题</span>
          <input type="checkbox" id="llmEnabled" style="width:auto">
        </label>
        <label class="opt"><span>服务商</span>
          <select id="llmProvider">
            <option value="https://api.deepseek.com/v1|deepseek-chat">DeepSeek</option>
            <option value="https://dashscope.aliyuncs.com/compatible-mode/v1|qwen-plus">通义千问</option>
            <option value="https://open.bigmodel.cn/api/paas/v4|glm-4-flash">智谱 GLM</option>
            <option value="https://api.moonshot.cn/v1|moonshot-v1-8k">Kimi</option>
            <option value="https://api.perplexity.ai|sonar">Perplexity（联网检索）</option>
            <option value="https://api.openai.com/v1|gpt-4o-mini">OpenAI</option>
          </select>
        </label>
        <label class="opt"><span>模型名</span>
          <input type="text" id="llmModel" placeholder="deepseek-chat">
        </label>
        <label class="opt"><span>API Key</span>
          <input type="password" id="llmKey" placeholder="留空表示不修改">
        </label>
        <label class="opt"><span>最低置信度</span>
          <input type="number" id="llmMinConf" step="0.1" min="0" max="1" value="0">
        </label>
        <div class="row" style="margin-top:8px">
          <button onclick="saveLLM()" style="flex:1">保存</button>
          <button class="ghost" onclick="testLLM()" style="flex:1">测试连通</button>
        </div>
        <div class="muted" id="llmMsg" style="margin-top:6px"></div>
      </div>
    </details>

    <hr>
    <div class="now" id="now">等待开始</div>
    <div class="bar"><i id="bar"></i></div>
    <div class="muted" id="barText">—</div>

    <div class="status-grid">
      <div class="stat"><div class="k">视频完成</div><div class="v" id="sVideoOk">0</div></div>
      <div class="stat"><div class="k">视频失败</div><div class="v" id="sVideoFail">0</div></div>
      <div class="stat"><div class="k">答题完成</div><div class="v" id="sQuizOk">0</div></div>
      <div class="stat"><div class="k">答题失败</div><div class="v" id="sQuizFail">0</div></div>
    </div>
  </section>

  <!-- 右：日志 -->
  <section class="card">
    <h2>实时日志</h2>
    <div id="log"></div>
  </section>
</main>

<script>
var state = {courses: [], selected: {}, seq: 0, running: false, paused: false};
var $ = function(id){ return document.getElementById(id); };

function api(path, body){
  var opt = {method: 'GET', headers: {'Content-Type': 'application/json'}};
  if (body !== undefined) { opt.method = 'POST'; opt.body = JSON.stringify(body); }
  return fetch(path, opt).then(function(r){ return r.json(); });
}

/* ---------- 课程 ---------- */
function renderCourses(){
  var q = ($('search').value || '').trim().toLowerCase();
  var html = '';
  var list = state.courses.filter(function(c){
    return !q || c.name.toLowerCase().indexOf(q) >= 0;
  });
  if (!list.length) {
    html = '<div class="muted" style="padding:10px">' + (state.courses.length ? '没有匹配的课程' : '点「刷新」拉取课程') + '</div>';
  }
  list.forEach(function(c){
    var on = !!state.selected[c.cid];
    html += '<label class="course' + (on ? ' sel' : '') + '" data-cid="' + c.cid + '">' +
      '<input type="checkbox" ' + (on ? 'checked' : '') + ' onchange="pick(\'' + c.cid + '\', this.checked)">' +
      '<div><div class="nm">' + esc(c.name) + '</div><div class="id">' + c.cid + '</div></div></label>';
  });
  $('courseList').innerHTML = html;
  $('selCount').textContent = Object.keys(state.selected).filter(function(k){ return state.selected[k]; }).length;
}

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function pick(cid, on){ state.selected[cid] = on; renderCourses(); }

function toggleAll(){
  var q = ($('search').value || '').trim().toLowerCase();
  var list = state.courses.filter(function(c){ return !q || c.name.toLowerCase().indexOf(q) >= 0; });
  var allOn = list.every(function(c){ return state.selected[c.cid]; });
  list.forEach(function(c){ state.selected[c.cid] = !allOn; });
  renderCourses();
}

function refreshCourses(){
  $('courseList').innerHTML = '<div class="muted" style="padding:10px">拉取中…（会启动一次浏览器，约 15 秒）</div>';
  api('/api/courses/refresh', {}).then(function(d){
    if (!d.ok) { $('courseList').innerHTML = '<div class="muted" style="padding:10px">' + esc(d.msg || '失败') + '</div>'; return; }
    state.courses = d.courses;
    d.courses.forEach(function(c){ if (!(c.cid in state.selected)) state.selected[c.cid] = false; });
    renderCourses();
  });
}

function doLogin(){
  if (!confirm('会弹出一个浏览器窗口，在里面扫码登录。继续？')) return;
  var headless = $('headless') ? $('headless').checked : true;
  api('/api/login', {headless: false}).then(function(d){
    if (d.ok) alert('登录窗口已打开（最长等 15 分钟）。扫码完成、手机确认后窗口会自动关闭，课程列表随后自动刷新。');
    else alert(d.msg || '打不开登录窗口');
  });
}

/* ---------- 控制 ---------- */
function selectedIds(){
  return Object.keys(state.selected).filter(function(k){ return state.selected[k]; });
}

function startRun(){
  var ids = selectedIds();
  if (!ids.length) { alert('先选至少一门课'); return; }
  api('/api/run/start', {
    course_ids: ids,
    mode: $('mode').value,
    rate: parseFloat($('rate').value) || 1.5,
    max_tasks: parseInt($('maxTasks').value) || 0,
    submit: $('submit').checked,
    headless: $('headless').checked
  }).then(function(d){
    if (!d.ok) alert(d.msg || '启动失败');
    poll();
  });
}
function pauseRun(){ api('/api/run/pause', {}).then(poll); }
function resumeRun(){ api('/api/run/resume', {}).then(poll); }
function stopRun(){ api('/api/run/stop', {}).then(poll); }

/* ---------- 模型设置 ---------- */
function loadLLM(){
  api('/api/llm').then(function(d){
    if (!d || d.error) return;
    $('llmEnabled').checked = !!d.enabled;
    $('llmModel').value = d.model || '';
    $('llmMinConf').value = d.min_confidence || 0;
    $('llmKey').placeholder = d.has_key ? ('已保存 ' + d.key_hint + '，留空不改') : '粘贴你的 API Key';
    var sel = $('llmProvider');
    for (var i = 0; i < sel.options.length; i++) {
      var parts = sel.options[i].value.split('|');
      if (parts[0] === d.base_url) { sel.selectedIndex = i; break; }
    }
    var on = !!d.enabled && !!d.has_key;
    $('llmTag').textContent = on ? '已启用' : (d.enabled ? '缺 Key' : '未启用');
    $('llmTag').className = 'tag ' + (on ? 'on' : 'off');
    if (on) $('llmBox').open = false;
  }).catch(function(){});
}

$('llmProvider').addEventListener('change', function(){
  var parts = this.value.split('|');
  $('llmModel').value = parts[1] || '';
});

function saveLLM(){
  var parts = $('llmProvider').value.split('|');
  var body = {
    enabled: $('llmEnabled').checked,
    base_url: parts[0],
    model: $('llmModel').value.trim() || parts[1],
    min_confidence: parseFloat($('llmMinConf').value) || 0
  };
  var k = $('llmKey').value.trim();
  if (k) body.api_key = k;
  api('/api/llm', body).then(function(d){
    $('llmMsg').textContent = d.msg || (d.ok ? '已保存' : '保存失败');
    if (d.ok) { $('llmKey').value = ''; loadLLM(); }
  });
}

function testLLM(){
  $('llmMsg').textContent = '测试中…';
  api('/api/llm/test', {}).then(function(d){
    $('llmMsg').textContent = (d.ok ? '✓ ' : '✗ ') + (d.msg || '');
  });
}

/* ---------- 状态轮询 ---------- */
function setButtons(run){
  var running = run.running;
  var paused = run.paused;
  $('btnStart').disabled = running;
  $('btnPause').disabled = !running || paused;
  $('btnResume').disabled = !running || !paused;
  $('btnStop').disabled = !running;
  $('runBadge').textContent = running ? (paused ? '已暂停' : '运行中') : '空闲';
  $('runBadge').className = 'badge ' + (running ? 'on' : '');
  var pb = $('phaseBadge');
  pb.style.display = running ? '' : 'none';
  pb.textContent = run.phase;
}

function renderStatus(d){
  var run = d.run;
  setButtons(run);
  $('sVideoOk').textContent = run.stats.video_ok || 0;
  $('sVideoFail').textContent = run.stats.video_fail || 0;
  $('sQuizOk').textContent = run.stats.quiz_ok || 0;
  $('sQuizFail').textContent = run.stats.quiz_fail || 0;

  var now = '';
  if (run.course) now += '课程 <b>' + esc(run.course) + '</b> (' + run.course_index + '/' + run.course_total + ')<br>';
  if (run.task) now += '小节 <b>' + esc(run.task) + '</b> (' + run.task_index + '/' + run.task_total + ') · ' + run.task_kind;
  if (run.last_error) now += '<br><span style="color:var(--err)">错误: ' + esc(run.last_error) + '</span>';
  $('now').innerHTML = now || '等待开始';

  var p = run.progress || 0;
  $('bar').style.width = (p * 100).toFixed(1) + '%';
  $('barText').textContent = p > 0 ? '当前视频 ' + (p * 100).toFixed(1) + '%' : '—';

  var lb = d.login || {};
  var b = $('loginBadge');
  if (lb.running) { b.textContent = '登录中…（窗口里扫码）'; b.className = 'badge'; }
  else if (lb.ok === true) { b.textContent = '已登录'; b.className = 'badge on'; }
  else if (lb.ok === null) { b.textContent = lb.msg || '登录态待验证'; b.className = 'badge'; }
  else { b.textContent = lb.msg || '未登录'; b.className = 'badge off'; }

  if (d.bank && d.bank.total !== undefined) $('bankTotal').textContent = d.bank.total;
  if (d.pending !== undefined) {
    $('pendingCount').textContent = d.pending;
    $('pendingBadge').className = 'badge' + (d.pending ? ' off' : '');
  }
  if (d.courses && d.courses.length && !state.courses.length) {
    state.courses = d.courses;
    d.courses.forEach(function(c){ if (!(c.cid in state.selected)) state.selected[c.cid] = false; });
    renderCourses();
  }
}

function appendLog(lines){
  if (!lines.length) return;
  var el = $('log');
  var atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 40;
  var buf = '';
  lines.forEach(function(l){
    buf += '<div class="ln ' + l.level + '"><span class="t">' + l.t + '</span>' + esc(l.msg) + '</div>';
  });
  el.insertAdjacentHTML('beforeend', buf);
  while (el.childElementCount > 1200) el.removeChild(el.firstChild);
  if (atBottom) el.scrollTop = el.scrollHeight;
}

function poll(){
  api('/api/status?since=' + state.seq).then(function(d){
    state.seq = d.seq;
    renderStatus(d);
    appendLog(d.log || []);
  }).catch(function(){});
}

setInterval(poll, 1200);
poll();
loadLLM();
</script>
</body>
</html>
